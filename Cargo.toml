[package]
name = "mechrevo"
version = "0.2.0"
edition = "2021"
description = "Hardware Control Utility for MECHREVO Gaming Laptops on Linux (Rust Implementation)"
authors = ["Antigravity Assistant"]
license = "MIT"

[lib]
name = "mechrevo"
path = "src/lib.rs"

[[bin]]
name = "mechrevo-ctl"
path = "src/bin/ctl.rs"

[[bin]]
name = "mechrevo-ctld"
path = "src/bin/ctld.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ctrlc = "3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
