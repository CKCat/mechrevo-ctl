[package]
name = "mechrevo"
version = "0.2.0"
edition = "2021"
description = "Hardware Control Utility for MECHREVO Gaming Laptops on Linux (Rust Implementation)"
authors = ["Antigravity Assistant"]
license = "MIT"

[lib]
name = "mechrevo"
path = "src/lib.rs"

[[bin]]
name = "mechrevo-ctl"
path = "src/bin/ctl.rs"

[[bin]]
name = "mechrevo-ctld"
path = "src/bin/ctld.rs"

[[bin]]
name = "mechrevo-gui"
path = "src/bin/gui.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ctrlc = "3.4"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.17"
