<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded hexagon/shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#232d3f" stroke-width="2"/>

  <!-- Subtle grid lines -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1f293d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="#1a2334" stroke-width="1"/>

  <!-- Gaming Wing/Shield Icon (MECHREVO / Mech wings M emblem) -->
  <g filter="url(#glow)">
    <!-- Left Wing -->
    <path d="M 32 38 L 48 38 L 58 64 L 46 88 L 32 88 L 44 64 Z" fill="url(#cyanGrad)"/>
    <!-- Right Wing -->
    <path d="M 96 38 L 80 38 L 70 64 L 82 88 L 96 88 L 84 64 Z" fill="url(#cyanGrad)"/>
    <!-- Center Core / Dragon Crest -->
    <polygon points="64,28 72,48 64,54 56,48" fill="#ffffff"/>
    <polygon points="64,58 74,74 64,96 54,74" fill="url(#cyanGrad)"/>
  </g>

  <!-- Status Pulse Dot -->
  <circle cx="64" cy="64" r="3.5" fill="#ffffff"/>
  <circle cx="100" cy="28" r="4" fill="#00f2fe"/>
</svg>

