[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mechrevo-ctl"
version = "0.1.0"
description = "Hardware Control Utility for MECHREVO Gaming Laptops on Linux"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Assistant"}
]
keywords = ["mechrevo", "linux", "hardware", "powercap", "nvidia", "fan-control", "rgb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Hardware",
]

[project.scripts]
mechrevo-ctl = "mechrevo.cli:main"
mechrevo-ctld = "mechrevo.daemon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mechrevo*"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


